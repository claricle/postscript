name: grammar

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # parsanol is not a dependency of this gem; only this check needs it.
      - run: gem install parsanol --no-document --version '>= 1.3.96'
      - run: ruby script/check_grammar.rb
