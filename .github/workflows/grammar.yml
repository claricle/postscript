name: grammar

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # parsanol is not a dependency of this gem; only this check needs it.
      # Pinned to the compiler that built the vendored artifact (its envelope
      # records compiler_version) — a floating install breaks this check on
      # every parsanol patch release, since the compiled payload tracks the
      # compiler. etassia-grammar's CI uses the same contract.
      - run: gem install parsanol --no-document -v "$(ruby -rjson -e 'print JSON.parse(File.read("grammars/postscript.json"))["compiler_version"]')"
      - run: ruby script/check_grammar.rb
      - run: ruby script/check_guide_operators.rb
